[project]
name = "analytics-platform"
version = "0.1.0"
description = "End-to-end e-commerce ETL: DummyJSON API -> MinIO data lake (bronze/silver) -> PostgreSQL analytical warehouse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "boto3>=1.35",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl"]
